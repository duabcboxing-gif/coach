<body>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button id="sessionBtn" class="topbar-btn session-btn" type="button" aria-label="Change session">
        <span class="wordmark">DUABC</span>
        <span class="dot">·</span>
        <span id="sessionName" class="session-name">…</span>
        <span id="sessionDate" class="session-date"></span>
        <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="coachBtn" class="topbar-btn coach-btn" type="button" aria-label="Coach menu">
        <span id="coachName"></span>
        <svg id="muteIcon" class="mute-icon" viewBox="0 0 16 16" aria-hidden="true" hidden><path d="M3 6h2l3-2.5v9L5 10H3z M11 6l4 4 M15 6l-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main class="main">
      <section id="scanner" class="scanner" aria-label="QR scanner">
        <div id="reader" class="reader"></div>
        <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <button id="scannerMsg" class="scanner-msg" type="button" hidden></button>
        <div id="pill" class="pill" hidden><span class="spinner"></span><span id="pillText">Checking…</span></div>
      </section>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input id="search" type="search" inputmode="search" placeholder="Search name" autocomplete="off" autocorrect="off"
               autocapitalize="words" spellcheck="false" enterkeyhint="search" aria-label="Search member name">
        <button id="clearSearch" class="clear-btn" type="button" aria-label="Clear" hidden>
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="currentColor"/><path d="M7 7l6 6M13 7l-6 6" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p id="indexState" class="index-state" aria-live="polite"></p>
      <ul id="results" class="results" aria-label="Matching members"></ul>
    </main>
  </div>

  <!-- Full-screen green / red result -->
  <div id="flash" class="flash" role="alert" aria-live="assertive">
    <div class="flash-icon" id="flashIcon"></div>
    <div class="flash-title" id="flashTitle"></div>
    <div class="flash-detail" id="flashDetail"></div>
    <button class="flash-ec" id="flashEc" type="button" hidden>Emergency contact</button>
    <div class="flash-ec-box" id="flashEcBox" hidden></div>
  </div>

  <!-- Slide-up card -->
  <div id="backdrop" class="backdrop"></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grabber" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </section>

  <!-- First-run panels -->
  <section id="setupPanel" class="panel" hidden>
    <div class="panel-inner">
      <p class="wordmark wordmark-lg">DUABC</p>
      <h1 class="panel-title">Set up this phone</h1>
      <p class="panel-text">Open the coach link the Treasurer sent you. On iPhone, if you added the app to your home screen, paste that link here once:</p>
      <form id="setupForm" class="panel-form" autocomplete="off">
        <input id="setupInput" class="field" type="url" placeholder="Paste the coach link" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <button class="btn-primary" type="submit">Continue</button>
        <button id="pasteBtn" class="btn-text" type="button">Paste from clipboard</button>
      </form>
      <p id="setupError" class="panel-error" hidden></p>
    </div>
  </section>

  <section id="namePanel" class="panel" hidden>
    <div class="panel-inner">
      <p class="wordmark wordmark-lg">DUABC</p>
      <h1 class="panel-title">Your name</h1>
      <p class="panel-text">So the club knows who checked people in. Just once on this phone.</p>
      <form id="nameForm" class="panel-form" autocomplete="off">
        <input id="nameInput" class="field" type="text" list="coachList" placeholder="First and last name" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="40" required>
        <datalist id="coachList"></datalist>
        <button id="nameSubmit" class="btn-primary" type="submit">Continue</button>
      </form>
      <p id="nameError" class="panel-error" hidden></p>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"
          integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+"
          crossorigin="anonymous" referrerpolicy="no-referrer"
          onerror="var s=document.createElement('script');s.src='vendor/html5-qrcode.min.js';document.head.appendChild(s);"></script>
  <script src="app.js"></script>
</body>
</html>
