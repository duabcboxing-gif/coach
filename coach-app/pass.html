<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-title" content="DUABC pass">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>DUABC training pass</title>
<style>
  /* DUABC training pass. Everything comes from the link's #fragment, which never leaves the phone.
     Only the random code is sent to the QR image service – never a name or email. */
  :root { --text: #1c1c1e; --muted: #6e6e73; --accent: #68246d; --line: rgba(60, 60, 67, .14); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: #f2f2f7; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 22px; padding: 28px 24px 26px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.08); text-align: center; }
  .wordmark { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .16em; color: var(--muted); }
  h1 { margin: 6px 0 2px; font-size: 26px; letter-spacing: -.01em; }
  .plan { margin: 0; font-size: 16px; color: var(--muted); }
  .plan b { color: var(--text); font-weight: 600; }
  .qr { margin: 22px auto 14px; width: 100%; max-width: 300px; aspect-ratio: 1; border-radius: 16px;
    border: 1px solid var(--line); background: #fff; padding: 10px; display: block; }
  .code { margin: 0; font: 600 17px/1.3 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .06em; }
  .tip { margin: 18px 0 0; font-size: 15px; line-height: 1.45; }
  .small { margin: 10px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
  .expired .qr { opacity: .35; filter: grayscale(1); }
  .badge { display: inline-block; margin-top: 10px; padding: 5px 10px; border-radius: 999px; font-size: 13px;
    font-weight: 600; background: rgba(142,142,147,.18); color: var(--muted); }
  .error h1 { font-size: 22px; }
</style>
</head>
<body>
<main>
  <section class="card" id="card">
    <p class="wordmark">DUABC</p>
    <h1 id="title">Training pass</h1>
    <p class="plan" id="plan"></p>
    <img class="qr" id="qr" alt="Your DUABC QR code" width="300" height="300" hidden>
    <p class="code" id="code"></p>
    <span class="badge" id="badge" hidden></span>
    <p class="tip" id="tip">Screenshot this and show it to a coach at the door.</p>
    <p class="small" id="small">Your code is personal to you – please don't share it.</p>
  </section>
</main>
<script>
(function () {
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var params = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) { try { params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); } catch (e) { /* ignore */ } }
  });
  var $ = function (id) { return document.getElementById(id); };
  var code = String(params.c || '').trim().toUpperCase();
  if (!/^[A-Z]{2,10}-[A-Z0-9]{6,12}$/.test(code)) {
    $('card').className = 'card error';
    $('title').textContent = 'This pass link is incomplete';
    $('tip').textContent = 'Open the link from your DUABC email again – make sure the whole link was copied.';
    $('small').textContent = 'Still stuck? Ask the Treasurer to resend your pass.';
    return;
  }
  var plan = String(params.p || '').slice(0, 40);
  var until = /^\d{4}-\d{2}-\d{2}$/.test(params.u || '') ? params.u : '';
  var nice = '';
  if (until) { var p = until.split('-'); nice = Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }
  $('plan').textContent = '';
  if (plan) { var b = document.createElement('b'); b.textContent = plan; $('plan').appendChild(b); }
  if (nice) $('plan').appendChild(document.createTextNode((plan ? ' · ' : '') + 'valid until ' + nice));
  $('code').textContent = code;
  var qr = $('qr');
  qr.src = 'https://quickchart.io/qr?size=600&margin=1&text=' + encodeURIComponent(code);
  qr.hidden = false;
  if (until) {
    var now = new Date();
    var today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    if (today > until) {
      $('card').className = 'card expired';
      $('badge').textContent = 'Plan ended ' + nice;
      $('badge').hidden = false;
      $('tip').textContent = 'Renew your plan with the Treasurer – your code will work again once it is verified.';
    }
  }
  document.title = 'DUABC pass · ' + code;
})();
</script>
</body>
</html>
